<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>
html,body{margin:0;padding:0;background:#fff;width:820px;height:430px;overflow:hidden}
svg{display:block;font-family:"Times New Roman","SimSun",serif}
</style></head><body>
<svg xmlns="http://www.w3.org/2000/svg" width="820" height="430" viewBox="0 0 820 430">
<rect width="820" height="430" fill="#ffffff"/>

<!-- 网格 -->
<g stroke="#d8d8d8" stroke-width="0.7" stroke-dasharray="3 4">
  <line x1="90" y1="270" x2="770" y2="270"/>
  <line x1="90" y1="200" x2="770" y2="200"/>
  <line x1="90" y1="130" x2="770" y2="130"/>
  <line x1="90" y1="60"  x2="770" y2="60"/>
</g>

<!-- 坐标轴 -->
<line x1="90" y1="60" x2="90" y2="340" stroke="#000" stroke-width="1.3"/>
<line x1="90" y1="340" x2="778" y2="340" stroke="#000" stroke-width="1.3"/>
<polygon points="90,50 85,62 95,62" fill="#000"/>

<!-- y 刻度 -->
<g font-size="13" fill="#000" text-anchor="end">
  <text x="82" y="345">0</text>
  <text x="82" y="275">25</text>
  <text x="82" y="205">50</text>
  <text x="82" y="135">75</text>
  <text x="82" y="65">100</text>
</g>
<text transform="rotate(-90 46 200)" x="46" y="200" font-size="14" text-anchor="middle">可达率（%）</text>

<!-- Low：10.0 -> 100 -->
<rect x="136" y="312" width="56" height="28" fill="#bfbfbf" stroke="#666" stroke-width="0.8"/>
<rect x="200" y="60"  width="56" height="280" fill="#333333"/>
<text x="164" y="306" font-size="12" text-anchor="middle">10.0</text>
<text x="228" y="52"  font-size="12" text-anchor="middle">100.0</text>

<!-- Medium：1.8 -> 100 -->
<rect x="361" y="335" width="56" height="5" fill="#bfbfbf" stroke="#666" stroke-width="0.8"/>
<rect x="425" y="60"  width="56" height="280" fill="#333333"/>
<text x="389" y="328" font-size="12" text-anchor="middle">1.8</text>
<text x="453" y="52"  font-size="12" text-anchor="middle">100.0</text>

<!-- High：96.7 -> 100 -->
<rect x="586" y="69"  width="56" height="271" fill="#bfbfbf" stroke="#666" stroke-width="0.8"/>
<rect x="650" y="60"  width="56" height="280" fill="#333333"/>
<text x="614" y="62"  font-size="12" text-anchor="middle">96.7</text>
<text x="678" y="52"  font-size="12" text-anchor="middle">100.0</text>

<!-- x 标签 -->
<g font-size="14" fill="#000" text-anchor="middle">
  <text x="228" y="362">Low</text>
  <text x="228" y="378" font-size="11">sel 0.500%</text>
  <text x="453" y="362">Medium</text>
  <text x="453" y="378" font-size="11">sel 2.750%</text>
  <text x="678" y="362">High</text>
  <text x="678" y="378" font-size="11">sel 10.500%</text>
</g>

<!-- 图例 -->
<g font-size="13" fill="#000">
  <rect x="250" y="400" width="26" height="12" fill="#bfbfbf" stroke="#666" stroke-width="0.8"/>
  <text x="284" y="411">补边前</text>
  <rect x="380" y="400" width="26" height="12" fill="#333333"/>
  <text x="414" y="411">补边后</text>
</g>
</svg>
</body></html>
